[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiobale-py"
version = "0.3.2"
description = "Modern, fast, fully asynchronous Python framework for Bale Messenger."
requires-python = ">=3.8"
dependencies = [
    "aiohttp<4.0,>=3.9",
    "aiofiles<24.0,>=23.1",
    "colorama<1.0,>=0.4.6",
    "pydantic<3.0,>=2.0",
    "typing_extensions<5.0,>=4.0",
    "blackboxprotobuf<2.0,>=1.0.1",
    "magic-filter<2.0,>=1.0"
]
